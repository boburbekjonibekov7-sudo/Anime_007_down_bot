[project]
name = "anime-007-down-bot"
version = "1.0.0"
description = "Telegram anime bot with webhook (Vercel serverless)"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.13.1",
    "aiosqlite==0.20.0",
    "aiohttp==3.10.5",
    "asyncpg==0.31.0",
    "fastapi>=0.110,<1.0",
]

[tool.vercel]
# Vercel Python App: barcha so'rovlar (GET / va POST /webhook) shu ASGI app'ga keladi
entrypoint = "api.webhook:app"
